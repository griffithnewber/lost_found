<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>失物招领 · 广场</title>
<!-- WorkBuddy 云服务 SDK（CDN 全局形式） -->
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<link rel="stylesheet" href="assets/styles.css?v=20261109d">
<link rel="stylesheet" href="assets/contact.css?v=20261109d">
<link rel="stylesheet" href="assets/square.css?v=20261109d">
<link rel="stylesheet" href="assets/map.css?v=20261109d">
<link rel="stylesheet" href="assets/mailbox.css?v=20261109d">
</head>
<body>

<h1>🧭 失物招领 · 广场</h1>
<div class="sub">
  只读看板 · 数据由「寻物官 · 阿寻」统一登记
  <span class="sync-flag" id="cloud-status">⏳ 正在连接云端…</span>
  <span id="auth-area"></span>
</div>

<!-- 聊天框入口横幅：网页已降级为只读看板，登记/查找/核验都要回聊天框 -->
<div class="agent-banner" id="agent-banner">
  <div class="agent-banner-main">
    <div class="agent-banner-title">💬 登记和认领都在聊天框里跟「寻物官 · 阿寻」完成</div>
    <div class="agent-banner-desc">网页现在只做展示：不能发布、不能搜索、不能核验。有新东西找不到，回来问阿寻就行。</div>
  </div>
  <button type="button" class="ghost agent-banner-btn" id="agent-banner-btn">怎么找阿寻？</button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="square">🏛️ 广场</div>
  <div class="tab" data-tab="mailbox">📬 信箱</div>
</div>

<!-- 广场：所有人可见的待认领失物（顶部：筛选 chips + 校园地图） -->
<div class="panel active" id="panel-square">

  <div class="filter-chips" id="filter-chips">
    <button type="button" class="chip active" data-mode="all">全部</button>
    <button type="button" class="chip" data-mode="found">📦 捡到的</button>
    <button type="button" class="chip" data-mode="lost">🔍 丢了在找</button>
    <button type="button" class="chip" data-mode="pickup">📍 寄存点</button>
  </div>

  <!-- 校园地图：物品按区域落 emoji 标记，寄存点单独一层；与下方广场列表双向联动
       （底图=腾讯地图真实校区，坐标见 assets/zones.js） -->
  <div class="card map-card">
    <div class="map-head">
      <span class="map-title">🗺️ 校园地图 · 点标记查看广场对应记录</span>
      <span class="map-sub">中山大学深圳校区 · 区域级精度 · 不展示具体位置<span id="map-unlocated"></span></span>
    </div>
    <div id="campus-map"></div>
  </div>

  <div class="card">
    <label>广场 · 所有待认领的失物（只展示公开信息，隐藏细节与具体位置不展示）</label>
    <input type="text" id="square-search" placeholder="按名称或特征筛，例：耳机 / 黑色">
    <button class="ghost" id="btn-square-refresh" style="margin-top:8px">🔄 刷新广场</button>
    <div class="hint" id="square-count"></div>

    <div class="code-bind">
      <label style="margin-top:14px">🔑 有编号？绑定归属，或查这条找到没</label>
      <div class="code-bind-row">
        <input type="text" id="bind-code" placeholder="例：LF-18 或 18" maxlength="16">
        <button class="ghost" id="btn-bind-code">绑定 / 查询</button>
      </div>
      <div class="hint">阿寻拿不到你的账号，它登记的是「无主」记录。绑定后补照片、收留言、确认找回都算你自己那条；已找回的记录输入编号会直接显示归宿。</div>
    </div>
  </div>

  <!-- 文字检索：受开关控制（?textsearch=1 或 LF.config.features.textSearch）。
       默认 hidden —— 开关关着时页面表现与「只读看板」完全一致。 -->
  <div class="card" id="text-search-card" hidden>
    <label>🔎 文字匹配（结果来自数据库共享函数）</label>
    <div class="code-bind-row">
      <input type="text" id="text-search-input" placeholder="例：黑色耳机 / 证件卡 / 雨伞" maxlength="40">
      <button class="ghost" id="btn-text-search">检索</button>
    </div>
    <div class="hint" id="text-search-hint">顺序、分数、分级都由 lf_search_text_v1 返回，网页不重算；登记与核验仍在聊天框。</div>
    <div id="text-search-list"></div>
  </div>

  <div id="square-list"></div>
</div>

<!-- 信箱 -->
<div class="panel" id="panel-mailbox">
  <div class="card">
    <label>📬 我的信箱（收件与发件都会跟着账号走）</label>
    <div id="mailbox-body"></div>
  </div>
</div>

<!-- 通用弹窗：只留给「✉️ 联系发布者」的留言线程用，认领核验已移出网页 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <button class="modal-close" id="btn-modal-close" title="关闭">✕</button>
    <h3 id="modal-title">💬 留言</h3>
    <div class="hint" id="modal-sub"></div>
    <div class="chat" id="chat"></div>
    <div id="modal-action"></div>
  </div>
</div>

<div id="toast-wrap"></div>

<!-- 模块加载顺序：config → api → ai → ui → zones → map → textsearch → app → contact → square → auth → mailbox → notify -->
<!-- textsearch.js 在 app.js 之前：横幅文案要读 LF.textSearch.enabled() -->
<!-- zones.js / map.js：校园地图（腾讯地图 GL JS，合规数据源），
     square.js 负责挂载与联动。
     ⚠️ Key：到 lbs.qq.com 控制台 → 应用管理 → 创建应用 → 添加 Key（勾选「JavascriptAPI GL」），
     替换下面 gljs 链接里的 key= 占位符，并在 Key 的域名白名单里加上本站域名 -->
<script src="https://map.qq.com/api/gljs?v=1.exp&key=GH5BZ-SFY3U-AN5VV-G2PBZ-F6JO2-TLFMW"></script>
<!-- search.js / match.js / stats.js 已随检索与统计面板一起下线，不再引入 -->
<script src="assets/config.js?v=20261109d"></script>
<script src="assets/api.js?v=20261109d"></script>
<script src="assets/ai.js?v=20261109d"></script>
<script src="assets/ui.js?v=20261109d"></script>
<script src="assets/zones.js?v=20261109d"></script>
<script src="assets/map.js?v=20261109d"></script>
<script src="assets/textsearch.js?v=20261109d"></script>
<script src="assets/app.js?v=20261109d"></script>
<script src="assets/contact.js?v=20261109d"></script>
<script src="assets/square.js?v=20261109d"></script>
<script src="assets/auth.js?v=20261109d"></script>
<script src="assets/mailbox.js?v=20261109d"></script>
<script src="assets/notify.js?v=20261109d"></script>
</body>
</html>
